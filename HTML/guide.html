<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../CSS/guide.css">
  <link rel="stylesheet" href="../CSS/dufu.css">
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.1.1/dist/model-viewer.min.js"></script>
</head>
<body>
  <!-- 杜甫数字人悬浮助手 START -->
<div id="dufu-assistant">
  <!-- 悬浮球 -->
  <div class="dufu-float-wrap">
    <div class="dufu-float-ball" id="dufuFloatBall">
      <div id="canvas-container" >
        <model-viewer 
        src="../dufu modle.glb" 
        alt="杜甫3D模型"
        auto-rotate
        shadow-intensity="1"
        camera-controls
        style="width:100%; height:100%">>
       
      </model-viewer>
      </div>

      
    </div>
    <!-- 悬浮菜单 -->
    <div class="dufu-hover-menu" id="dufuHoverMenu">
      <button class="dufu-menu-item" data-action="chat">AI问答</button>
      <button class="dufu-menu-item" data-action="search">杜诗检索</button>
      <button class="dufu-menu-item" data-action="annotation">注释解析</button>
      <button class="dufu-menu-item" data-action="recite">诗词朗诵</button>
      <button class="dufu-menu-item" data-action="story">背景故事</button>
    </div>
  </div>

  <!-- 对话面板 -->
  <div class="dufu-panel" id="dufuPanel">
    <div class="dufu-panel-header">
      <div class="dufu-panel-title">
        <div class="dufu-panel-avatar">杜</div>
        <div>
          <div class="title-main">杜甫数字人</div>
          <div class="title-sub">AI讲解 / 杜诗检索 / 朗诵 / 背景故事</div>
        </div>
      </div>
      <div class="dufu-panel-actions">
        <button id="dufuMinBtn" title="最小化">—</button>
        <button id="dufuCloseBtn" title="关闭">×</button>
      </div>
    </div>

    <div class="dufu-tabs">
      <button class="dufu-tab active" data-tab="chat">AI问答</button>
      <button class="dufu-tab" data-tab="search">杜诗检索</button>
      <button class="dufu-tab" data-tab="annotation">注释</button>
      <button class="dufu-tab" data-tab="recite">朗诵</button>
      <button class="dufu-tab" data-tab="story">背景</button>
    </div>

    <div class="dufu-panel-body">
      <!-- AI问答 -->
      <div class="dufu-tab-content active" id="tab-chat">
        <div class="dufu-messages" id="dufuMessages">
          <div class="dufu-msg assistant">
            <div class="msg-bubble">
              你好，我是杜甫数字人。你可以问我杜甫生平、诗作背景、诗句含义，也可以进行杜诗分类检索。
            </div>
          </div>
        </div>
        <div class="dufu-input-area">
          <textarea id="dufuQuestion" placeholder="请输入问题，例如：请讲解《春望》的情感内涵"></textarea>
          <button id="dufuSendBtn">发送</button>
        </div>
      </div>

      <!-- 杜诗检索 -->
      <div class="dufu-tab-content" id="tab-search">
        <div class="dufu-form">
          <input type="text" id="dufuSearchKeyword" placeholder="输入关键词，如：春望、爱国、成都、登高">
          <select id="dufuSearchCategory">
            <option value="">全部分类</option>
            <option value="山水">山水</option>
            <option value="忧国忧民">忧国忧民</option>
            <option value="思乡">思乡</option>
            <option value="边塞">边塞</option>
            <option value="咏史">咏史</option>
            <option value="写景">写景</option>
            <option value="人生感怀">人生感怀</option>
          </select>
          <button id="dufuSearchBtn">检索</button>
        </div>
        <div class="dufu-result" id="dufuSearchResult">
          请输入关键词或选择分类进行检索。
        </div>
      </div>

      <!-- 注释 -->
      <div class="dufu-tab-content" id="tab-annotation">
        <div class="dufu-form vertical">
          <textarea id="dufuAnnotationText" placeholder="请输入诗句，如：国破山河在，城春草木深"></textarea>
          <button id="dufuAnnotationBtn">生成注释</button>
        </div>
        <div class="dufu-result" id="dufuAnnotationResult">
          输入诗句后可查看字词注释、句意翻译和赏析。
        </div>
      </div>

      <!-- 朗诵 -->
      <div class="dufu-tab-content" id="tab-recite">
        <div class="dufu-form vertical">
          <textarea id="dufuReciteText" placeholder="请输入需要朗诵的诗词内容"></textarea>
          <div class="dufu-inline-actions">
            <button id="dufuReciteBtn">开始朗诵</button>
            <button id="dufuStopReciteBtn">停止朗诵</button>
          </div>
        </div>
        <div class="dufu-result" id="dufuReciteResult">
          支持浏览器语音朗读；如需更高质量音色，可对接后端 TTS 接口。
        </div>
      </div>

      <!-- 背景故事 -->
      <div class="dufu-tab-content" id="tab-story">
        <div class="dufu-form vertical">
          <input type="text" id="dufuStoryTitle" placeholder="输入诗作名称，如：春望">
          <button id="dufuStoryBtn">查看背景故事</button>
        </div>
        <div class="dufu-result" id="dufuStoryResult">
          输入诗名后可查看创作背景、时代环境及作者心境。
        </div>
      </div>
    </div>
  </div>
</div>

          <img src="../IMG/searching.png" alt="搜索">
      </button>
      <button class="btn-3">
          <img src="../IMG/chinese.png" alt="中文">
      </button>
      <button class="btn-3">
        <img src="../IMG/english.png" alt="英文">

      <button class="btn-3" id="back-to-top">
      <img src="../IMG/backup.png"alt="回到顶部">
      </button>
   </nav>

</nav>
 
  <h1 class="title">您的建议,让草堂更美</h1>
  <div class="page-wrapper">
    <div class="form-container">
    <form id="visitorFeedbackForm">
        <div class="form-group">
            <label for="name">姓名 *</label>
            <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
            <label for="visitDate">参观日期</label>
            <input type="date" id="visitDate" name="visitDate" />
        </div>

        <div class="form-group">
            <label>满意度评分 *</label>
            <select id="rating" name="rating" required>
                <option value="">请选择</option>
                <option value="5">⭐️⭐️⭐️⭐️⭐️ (非常满意)</option>
                <option value="4">⭐️⭐️⭐️⭐️</option>
                <option value="3">⭐️⭐️⭐️</option>
                <option value="2">⭐️⭐️</option>
                <option value="1">⭐️ (需改进)</option>
            </select>
        </div>

        
        <div class="form-group">
            <label>最喜欢的景点（可多选）</label>
            <div class="spots-grid">
                <label class="spot-option">
                    <input type="checkbox" name="favorite" value="柴门" />
                    <span>柴门</span>
                    <img src="../IMG/柴门.jpg" alt="柴门"/>
                </label>
                <label class="spot-option">
                    <input type="checkbox" name="favorite" value="工部祠" />
                    <span>工部祠</span>
                    <img src="../IMG/工部祠.jpg" alt="工部祠" />
                </label>
                <label class="spot-option">
                    <input type="checkbox" name="favorite" value="茅屋故居" />
                    <span>茅屋故居</span>
                    <img src="../IMG/茅屋故居.jpg" alt="茅屋故居"/>
                </label>
                <label class="spot-option">
                    <input type="checkbox" name="favorite" value="花径" />
                    <span>花径</span>
                    <img src="../IMG/花径.png" alt="花径" />
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="suggestions">改进建议</label>
            <textarea id="suggestions" name="suggestions" rows="3" placeholder="请告诉我们您的宝贵意见..."></textarea>
        </div>

        <div class="form-group consent">
          <div class="consent-options">
            <label class="consent-option">
                <input type="checkbox" name="notify" value="yes" />
                愿意接收草堂文化活动通知
            </label>
            <label class="consent-option">
                <input type="checkbox" name="notify" value="no" />
                不愿意
            </label>
          </div>
        </div>
        <button type="submit" class="btn-submit">提交反馈</button>
    </form>
  </div>
</div>
<footer>
    <p>杜甫草堂</p>
  </footer>
<script src="../JS/guide.js"></script>

</body>
